        <path d="M450 408 V520" stroke="rgba(26,25,23,.78)" stroke-width="2"/>
        <path d="M332 408 L322 470 M568 408 L578 470" stroke="rgba(32,30,27,.28)" stroke-width="2"/>
        <path d="M350 430 Q380 468 400 500" fill="none" stroke="rgba(32,30,27,.28)" stroke-width="2"/>
        <path d="M550 430 Q520 468 500 500" fill="none" stroke="rgba(32,30,27,.28)" stroke-width="2"/>
        <path d="M386 600 L382 900 M514 600 L518 900" stroke="rgba(32,30,27,.28)" stroke-width="1.5" opacity=".7"/>
