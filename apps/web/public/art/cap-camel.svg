        <path d="M380 530 Q420 610 420 700 M560 530 Q520 610 520 700" stroke="rgba(32,30,27,.28)" stroke-width="2"/>
        <circle cx="470" cy="500" r="7" fill="#926f44"/>
        <path d="M250 770 Q430 796 606 746" stroke="rgba(32,30,27,.09)" stroke-width="10" fill="none"/>
      
    <path d="M300 420 C420 450 560 450 660 420 L660 940 L300 940 Z" fill="url(#sheen)" opacity=".25" style="mix-blend-mode:screen"/>
