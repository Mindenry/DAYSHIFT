<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="GOLD HOOPS in indigo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F2EDE4"/>
      <stop offset="1" stop-color="#E4DCCD"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A2724" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2A2724" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity=".7"/>
  <rect x="52" y="52" width="796" height="1096" fill="none" stroke="#2A2724" stroke-opacity=".16"/>
  <ellipse cx="450" cy="960" rx="260" ry="58" fill="url(#shadow)"/><filter id="drop"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#201e1b" flood-opacity="0.22"/></filter>
  <g>
    
        <circle cx="380" cy="600" r="110" fill="none" stroke="#3C4B5C" stroke-width="16"/>
        <circle cx="380" cy="600" r="110" fill="none" stroke="#526172" stroke-width="4" opacity=".7"/>
        <circle cx="560" cy="660" r="84" fill="none" stroke="#3C4B5C" stroke-width="13"/>
        <circle cx="560" cy="660" r="84" fill="none" stroke="#526172" stroke-width="3" opacity=".7"/>
        <circle cx="380" cy="490" r="10" fill="#142334"/>
        <circle cx="560" cy="576" r="8" fill="#142334"/>
      
    <path d="M300 420 C420 450 560 450 660 420 L660 940 L300 940 Z" fill="url(#sheen)" opacity=".25" style="mix-blend-mode:screen"/>
  </g>
  <text x="88" y="1112" font-family="Helvetica, Arial, sans-serif" font-size="17" letter-spacing="5" fill="#2A2724" fill-opacity=".62">DAYSHIFT</text>
  <text x="812" y="1112" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#2A2724" fill-opacity=".5">GOLD HOOPS</text>
  <text x="88" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#2A2724" fill-opacity=".45">STUDIO / 09</text>
</svg>