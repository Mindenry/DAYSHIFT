<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="LEATHER SANDAL in camel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F2EDE4"/>
      <stop offset="1" stop-color="#E4DCCD"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A2724" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2A2724" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity=".7"/>
  <rect x="52" y="52" width="796" height="1096" fill="none" stroke="#2A2724" stroke-opacity=".16"/>
  <ellipse cx="450" cy="960" rx="260" ry="58" fill="url(#shadow)"/><filter id="drop"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#201e1b" flood-opacity="0.22"/></filter>
  <g>
    
        <path d="M260 770 Q450 720 660 770 L650 800 Q450 850 270 800 Z" fill="#B08D62" stroke="rgba(26,25,23,.78)" stroke-width="2.5"/>
        <path d="M300 770 Q360 660 430 742" fill="none" stroke="rgba(26,25,23,.78)" stroke-width="12"/>
        <path d="M420 748 Q500 650 590 752" fill="none" stroke="rgba(26,25,23,.78)" stroke-width="12"/>
        <path d="M300 770 L330 700 M590 752 L620 700" stroke="rgba(32,30,27,.28)" stroke-width="3"/>
        <path d="M300 700 Q310 690 320 700 M600 700 Q610 690 620 700" fill="none" stroke="rgba(26,25,23,.78)" stroke-width="3"/>
        <path d="M270 806 Q450 850 650 806" stroke="rgba(32,30,27,.28)" stroke-width="7" fill="none"/>
      
    <path d="M300 420 C420 450 560 450 660 420 L660 940 L300 940 Z" fill="url(#sheen)" opacity=".25" style="mix-blend-mode:screen"/>
